function formatearPrecio(precio) {
  if (precio === 'Consultar' || !precio) return precio;
  if (precio.includes('€')) return precio;
  if (/^\d+/.test(precio)) return precio + ' €/mes';

}

      <div class="cierre">La primera reunión no te compromete a nada. <strong>En 30 minutos sabes si esto encaja con lo que estás buscando.</strong></div>
      <div class="cta"><a href="tel:+34680507186" class="ctab">Hablar con Fede · 680 507 186</a></div>
    </div>
    ${socialProof()}
    ${foot()}
    ${rgpdBanner()}`;
}

// ═══════════════════════════════════════════════════════════════
// RENDER PORTADA
// ═══════════════════════════════════════════════════════════════
function renderPortada(){
  let h = `
    <div class="hero fi"><div class="g1"></div><div class="g2"></div>
      <div class="htop"><div class="hbrand"><img src="assets/NN_Nat Ned__logo_01_rgb_fc_2400 (1).png" alt="NN" class="hlogo"></div></div>
      <div class="hpt">Portal de Propuestas · Fede Fontanals</div>
      <h1 class="htit">Selecciona la <em>propuesta</em> que quieres ver.</h1>
      <p class="hsub">Cada propuesta se personaliza con el nombre y los datos del cliente.</p>
    </div>
    ${strip()}
    <div class="body fi">
      <div class="greet">Bienvenido al portal de propuestas de <strong>Federico Fontanals</strong>, Agente Dinamizador Nationale-Nederlanden Xàtiva. Selecciona el producto para ver la propuesta completa.</div>`;

  for(const [fase, prods] of Object.entries(PORTADA_FASES)){
    h += `<div class="pht">${fase}</div>`;
    prods.forEach(k => {
      const p = PRODS[k];
      if(!p) return;
      h += `<a class="pc" href="?producto=${k}">
        <span class="pi">${p.ico}</span>
        <div><div class="pn">${p.nom}</div><div class="pd">${p.sub.split('.')[0]}.</div></div>
        <span class="pa">›</span>
      </a>`;
    });
  }

  h += `<div class="pht">🤝 Para Agentes</div>
    <a class="pc" href="?seccion=agente">
      <span class="pi">🤝</span>
      <div><div class="pn">Oportunidad de negocio Nationale-Nederlanden</div><div class="pd">Presentación personalizada para candidatos a agente.</div></div>
      <span class="pa">›</span>
    </a>
  </div>${socialProof()}${foot()}${rgpdBanner()}`;

  return h;
}

// ═══════════════════════════════════════════════════════════════
// MAIN
// ═══════════════════════════════════════════════════════════════
function main(){
  const sec = q('seccion'), prod = q('producto').toLowerCase();
  const nombre = q('nombre') || q('name');
  const prima = q('prima') || q('price');
  const app = document.getElementById('app');

  if(sec === 'agente') app.innerHTML = renderAgente(nombre);
  else if(prod && PRODS[prod]) app.innerHTML = renderProd(PRODS[prod], nombre, prima);
  else app.innerHTML = renderPortada();
}

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    main();
    document.getElementById('app').style.display = 'block';
    const l = document.getElementById('loader');
    l.classList.add('off');
    setTimeout(() => l.remove(), 500);
  }, 700);
});
</script>
</body>
</html>
