name: Sincronización Diaria de Cumpleaños

on:
  schedule:
    - cron: '0 6 * * *' # Todos los días a las 06:00 UTC (08:00 AM España)
  push:
    branches:
      - main
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  update-birthdays:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar motor de cumpleaños
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python Scripts_Herramientas/birthday_automation.py

      - name: Commit y Push de los cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Scripts_Herramientas/Felicitaciones_Cumple_NN.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Cumpleaños del día $(date +'%Y-%m-%d')" && git push)
