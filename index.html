<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propuesta Personalizada · Nationale-Nederlanden · Fede Fontanals</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--o:#E85D26;--ol:#FBF0EC;--om:#F4A07A;--od:#C44A18;--g:#0F6E56;--gl:#E4F4EF;--b:#1A4FAB;--bl:#EAF0FB;--p:#6B3FA0;--pl:#F0EAF8;--dk:#1C1714;--tx:#2A2420;--t2:#6A5F5A;--t3:#9A8F87;--br:#EDE8E3;--bg:#F5F0EB;--wh:#FFFFFF;--r:16px;--rs:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
#loader{position:fixed;inset:0;background:var(--dk);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:999;transition:opacity .4s}
#loader.off{opacity:0;pointer-events:none}
.ld{width:38px;height:38px;background:var(--o);border-radius:50%;animation:pu 1.2s ease-in-out infinite}
.lt{font-size:12px;color:rgba(255,255,255,.35);letter-spacing:.08em}
@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.5}}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
.hero{background:var(--dk);border-radius:var(--r) var(--r) 0 0;padding:36px 36px 32px;position:relative;overflow:hidden}
.g1{position:absolute;top:-80px;right:-80px;width:280px;height:280px;background:radial-gradient(circle,rgba(232,93,38,.22) 0%,transparent 65%);border-radius:50%}
.g2{position:absolute;bottom:-60px;left:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(232,93,38,.1) 0%,transparent 65%);border-radius:50%}
.htop{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;position:relative;z-index:1}
.hbrand{display:flex;align-items:center;gap:10px}
.bdot{width:34px;height:34px;background:var(--o);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:#fff}
.bname{font-size:12px;color:rgba(255,255,255,.4);letter-spacing:.07em;text-transform:uppercase}
.hbadge{font-size:10px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.45);padding:4px 10px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase}
.hpt{font-size:11px;color:var(--o);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;position:relative;z-index:1}
.htit{font-family:'Fraunces',serif;font-size:30px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:12px;position:relative;z-index:1}
.htit em{color:var(--o);font-style:normal}
.hsub{font-size:13.5px;color:rgba(255,255,255,.5);line-height:1.6;position:relative;z-index:1;max-width:420px}
.astrip{background:rgba(255,255,255,.05);border-top:1px solid rgba(255,255,255,.07);padding:14px 36px;display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.aav{width:38px;height:38px;border-radius:50%;background:var(--o);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:#fff}
.aav img{width:100%;height:100%;object-fit:cover}
.an{font-size:13px;font-weight:600;color:rgba(255,255,255,.85)}
.ar{font-size:11px;color:rgba(255,255,255,.4);margin-top:1px}
.ac{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ac a{font-size:11px;color:rgba(255,255,255,.4);text-decoration:none;transition:color .15s}
.ac a:hover{color:var(--o)}
.body{background:var(--wh);padding:32px 36px}
.greet{font-size:15px;color:var(--tx);line-height:1.75;margin-bottom:28px;padding-bottom:28px;border-bottom:1px solid var(--br)}
.greet strong{font-weight:600;color:var(--dk)}
.sl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;margin-bottom:12px}
.slo{color:var(--o)}.slg{color:var(--g)}.slb{color:var(--b)}.slp{color:var(--p)}
.fbadge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:20px}
.fbo{background:var(--ol);color:var(--od)}.fbb{background:var(--bl);color:var(--b)}.fbp{background:var(--pl);color:var(--p)}
.gap-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:28px}
.gc{background:#FAF7F5;border:1px solid var(--br);border-radius:var(--rs);padding:16px 14px;text-align:center}
.gc.hot{background:var(--ol);border-color:var(--om)}
.gn{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--dk);line-height:1;margin-bottom:5px}
.gc.hot .gn{color:var(--o)}
.gl{font-size:11px;color:var(--t3);line-height:1.3}
.hbox{border-radius:var(--rs);padding:14px 16px;margin-bottom:20px;font-size:13.5px;line-height:1.6}
.hbo{background:var(--ol);border-left:3px solid var(--o);color:var(--od)}
.hbb{background:var(--bl);border-left:3px solid var(--b);color:var(--b)}
.hbg{background:var(--gl);border-left:3px solid var(--g);color:var(--g)}
.hbp{background:var(--pl);border-left:3px solid var(--p);color:var(--p)}
.hbox strong{font-weight:600}
.st-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stc{background:#FAF7F5;border:1px solid var(--br);border-radius:var(--rs);padding:14px 12px;text-align:center}
.stv{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--dk);line-height:1;margin-bottom:4px}
.stl{font-size:11px;color:var(--t3);line-height:1.3}
.cl{border:1px solid var(--br);border-radius:var(--rs);overflow:hidden;margin-bottom:16px}
.cr{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--br);background:var(--wh)}
.cr:last-child{border-bottom:none}
.cr.ko{background:var(--ol)}.cr.kb{background:var(--bl)}.cr.kg{background:var(--gl)}.cr.kp{background:var(--pl)}
.cn{font-size:13px;color:var(--tx);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.to{background:var(--o);color:#fff}.tb{background:var(--b);color:#fff}.tg{background:var(--g);color:#fff}.tp{background:var(--p);color:#fff}
.crr{display:flex;align-items:center;gap:14px}
.cc{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.cp{font-size:13px;font-weight:600;color:var(--o);font-variant-numeric:tabular-nums;min-width:52px;text-align:right;font-family:'DM Mono',monospace}
.cp.nb{color:var(--b)}.cp.ng{color:var(--g)}.cp.np{color:var(--p)}
.total{background:var(--dk);border-radius:var(--rs);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.tll{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.tld{font-size:12px;color:rgba(255,255,255,.45);line-height:1.4}
.trp{font-family:'Fraunces',serif;font-size:32px;font-weight:700;color:var(--o)}
.trs{font-size:10px;color:rgba(255,255,255,.3);text-align:right;margin-top:3px}
.div{height:1px;background:var(--br);margin:0 0 28px}
.extras{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.ep{background:var(--gl);border-radius:var(--rs);padding:13px 15px;display:flex;gap:10px;align-items:flex-start}
.ei{font-size:20px;flex-shrink:0;margin-top:1px}
.et{font-size:13px;font-weight:600;color:var(--g)}
.ed{font-size:11px;color:#2A6454;margin-top:2px;line-height:1.4}
.cierre{font-size:14px;color:var(--tx);line-height:1.75;margin-bottom:24px}
.cierre strong{font-weight:600;color:var(--dk)}
.cta{text-align:center;margin-bottom:28px}
.ctab{display:inline-block;background:var(--o);color:#fff;font-size:14px;font-weight:600;padding:15px 36px;border-radius:100px;text-decoration:none;letter-spacing:.02em;box-shadow:0 4px 20px rgba(232,93,38,.35);transition:transform .15s,box-shadow .15s}
.ctab:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(232,93,38,.45)}
.foot{background:#EDE8E3;border-radius:0 0 var(--r) var(--r);padding:20px 36px;text-align:center}
.foot p{font-size:11px;color:var(--t3);line-height:1.6}
.pc{background:var(--wh);border:1.5px solid var(--br);border-radius:var(--rs);padding:18px 20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:14px;text-decoration:none;margin-bottom:10px}
.pc:hover{border-color:var(--o);background:var(--ol)}
.pi{font-size:26px;flex-shrink:0}
.pn{font-size:15px;font-weight:600;color:var(--dk)}
.pd{font-size:12px;color:var(--t3);margin-top:2px}
.pa{margin-left:auto;font-size:20px;color:var(--t3)}
.pht{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--br)}
.ogg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.ogc{background:#FAF7F5;border:1px solid var(--br);border-radius:var(--rs);padding:16px;text-align:center}
.ogi{font-size:24px;margin-bottom:8px}
.ogv{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--dk);margin-bottom:4px}
.ogl{font-size:11px;color:var(--t3);line-height:1.3}
.spl{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.spi{display:flex;gap:14px;align-items:flex-start;background:#FAF7F5;border:1px solid var(--br);border-radius:var(--rs);padding:14px 16px}
.spn{width:26px;height:26px;border-radius:50%;background:var(--o);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.spb{font-size:13.5px;color:var(--tx);line-height:1.55}
.spb strong{font-weight:600}
.spno{font-size:12px;color:var(--t3);margin-top:3px}
.pr{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.pi2{background:var(--ol);color:var(--od);font-size:12px;font-weight:500;padding:6px 14px;border-radius:20px}
.pi2.g{background:var(--gl);color:var(--g)}.pi2.b{background:var(--bl);color:var(--b)}
.fi{opacity:0;transform:translateY(14px);animation:fu .5s ease forwards}
@keyframes fu{to{opacity:1;transform:translateY(0)}}
.fi:nth-child(1){animation-delay:.05s}.fi:nth-child(2){animation-delay:.15s}.fi:nth-child(3){animation-delay:.25s}.fi:nth-child(4){animation-delay:.35s}
@media(max-width:500px){
  .hero,.body,.foot{padding-left:20px;padding-right:20px}
  .astrip{padding-left:20px;padding-right:20px}
  .htit{font-size:24px}
  .gap-row,.st-row,.ogg,.extras{grid-template-columns:1fr}
  .total{flex-direction:column;gap:12px;text-align:center}
  .trs{text-align:center}
  .cc{display:none}
  .ac{display:none}
}
</style>
</head>
<body>
<div id="loader"><div class="ld"></div><div class="lt">Preparando tu propuesta…</div></div>
<div class="wrap" id="app" style="display:none"></div>
<script>
const PRODS={
  // FASE 1
  sialp:{fase:'Fase 1 · Ahorro e Inversión',fb:'fbp',ico:'🏦',nom:'Plan SIALP',sub:'Seguro de Ahorro a Largo Plazo con exención fiscal total.',col:'p',
    tit:n=>`El ahorro que hace crecer <em>el dinero de ${n}</em> sin pagar a Hacienda.`,
    greet:n=>`Hola <strong>${n}</strong>,<br><br>El Plan SIALP es la herramienta de ahorro más eficiente: <strong>exención fiscal total de los rendimientos</strong> si mantienes la inversión 5 años.`,
    hb:{t:'hbp',x:'<strong>Ventaja clave:</strong> Exención fiscal total. Aportación máxima 5.000 €/año. Sin tributación al vencimiento.'},
    sts:[{v:'5.000 €',l:'Aportación máx. anual'},{v:'5 años',l:'Plazo mín. exención'},{v:'0%',l:'Tributación'}],
    covs:[{n:'Ahorro garantizado',c:'Hasta 5.000 €/año',p:'Desde 50 €/mes',k:true,t:'base'},{n:'Exención fiscal total',c:'100%',p:'✓',k:true,t:'ventaja'},{n:'Capital garantizado al vencimiento',c:'100%',p:'✓',k:false},{n:'Liquidez parcial',c:'A partir año 3',p:'—',k:false}],
    tdesc:'Aportación mensual flexible · Horizonte mín. 5 años',prima:'Desde 50 €/mes',
    cierre:n=>`<strong>${n}</strong>, ahorrar sin pagar impuestos es la decisión más inteligente. Empezamos con la aportación que elijas.`},

  flexible:{fase:'Fase 1 · Ahorro e Inversión',fb:'fbp',ico:'🌍',nom:'Plan Flexible (Unit Linked)',sub:'Inversión internacional dinámica sin vencimiento fijo.',col:'p',
    tit:n=>`La inversión internacional que hace <em>trabajar el dinero de ${n}</em>.`,
    greet:n=>`Hola <strong>${n}</strong>,<br><br>Gestión dinámica en mercados internacionales, sin vencimiento fijo. <strong>Tu dinero crece por encima de la inflación.</strong>`,
    hb:{t:'hbp',x:'<strong>Diferencial:</strong> Gestión activa en mercados internacionales. Sin vencimiento. Rescate en cualquier momento.'},
    sts:[{v:'Unit Linked',l:'Estructura'},{v:'Internacional',l:'Mercados'},{v:'Flexible',l:'Sin vencimiento'}],
    covs:[{n:'Gestión activa cartera internacional',c:'100% invertido',p:'Variable',k:true,t:'diferencial'},{n:'Sin vencimiento fijo',c:'Flexibilidad total',p:'✓',k:true,t:'ventaja'},{n:'Rescate total o parcial',c:'Cualquier momento',p:'—',k:false},{n:'Cobertura fallecimiento',c:'Capital invertido',p:'—',k:false}],
    tdesc:'Perfil: tolerancia media-alta al riesgo',prima:'A consultar',
    cierre:n=>`<strong>${n}</strong>, tu dinero puede trabajar más que tú. Analizamos juntos el perfil inversor que mejor te encaja.`},

  garantizado:{fase:'Fase 1 · Ahorro e Inversión',fb:'fbp',ico:'🔒',nom:'Plan Garantizado',sub:'Inversión internacional con garantía 100% del capital.',col:'p',
    tit:n=>`La inversión de ${n} <em>con garantía absoluta</em> del capital.`,
    greet:n=>`Hola <strong>${n}</strong>,<br><br>Participas en mercados internacionales <strong>sin arriesgar ni un euro del capital</strong>. Al vencimiento, 100% garantizado.`,
    hb:{t:'hbp',x:'<strong>Garantía contractual:</strong> 100% del capital garantizado al vencimiento. Sin riesgo de pérdida del principal.'},
    sts:[{v:'100%',l:'Capital garantizado'},{v:'0%',l:'Riesgo pérdida'},{v:'+Rentabilidad',l:'Potencial'}],
    covs:[{n:'Garantía 100% capital al vencimiento',c:'Contractual',p:'✓',k:true,t:'garantía'},{n:'Participación mercados internacionales',c:'Sin riesgo principal',p:'✓',k:true,t:'diferencial'},{n:'Rentabilidad adicional potencial',c:'Según mercado',p:'Variable',k:false},{n:'Cobertura fallecimiento',c:'Capital invertido',p:'—',k:false}],
    tdesc:'Perfil: conservador que quiere rentabilidad',prima:'A consultar',
    cierre:n=>`<strong>${n}</strong>, tranquilidad de no poder perder lo invertido. Esta es tu herramienta.`},

  flexicuenta:{fase:'Fase 1 · Ahorro e Inversión',fb:'fbp',ico:'💰',nom:'Flexicuenta (Ahorro Remunerado)',sub:'Rentabilidad garantizada y disponibilidad total sin penalización.',col:'g',
    tit:n=>`El ahorro de ${n} <em>siempre disponible</em> y siempre rentable.`,
    greet:n=>`Hola <strong>${n}</strong>,<br><br>Rentabilidad garantizada desde el día 1 y <strong>dinero disponible al instante, sin penalización</strong>. El fondo de emergencia perfecto.`,
    hb:{t:'hbg',x:'<strong>Ventaja única:</strong> Disponibilidad total inmediata SIN penalización. Rentabilidad garantizada desde el día 1.'},
    sts:[{v:'100%',l:'Disponibilidad inmediata'},{v:'0 €',l:'Penalización rescate'},{v:'Garantizada',l:'Rentabilidad'}],
    covs:[{n:'Disponibilidad total e inmediata',c:'Sin penalización',p:'✓',k:true,t:'clave'},{n:'Rentabilidad garantizada',c:'Desde día 1',p:'✓',k:true,t:'ventaja'},{n:'Aportaciones flexibles',c:'Sin límite mín.',p:'—',k:false},{n:'Sin plazo de permanencia',c:'Total libertad',p:'—',k:false}],
    tdesc:'Aportación flexible · Ideal como fondo de emergencia',prima:'Flexible',
    cierre:n=>`<strong>${n}</strong>, un colchón que renta mientras duermes es la base de cualquier estrategia económica.`},

  futuro:{fase:'Fase 1 · Ahorro e Inversión',fb:'fbp',ico:'📈',nom:'Contigo Futuro',sub:'Ahorro-inversión ESG con garantía diaria y creciente.',col:'p',
    tit:n=>`El plan de ahorro que hace crecer <em>el dinero de ${n}</em> con garantías diarias.`,
    greet:n=>`Hola <strong>${n}</strong>,<br><br>Contigo Futuro: inversión sostenible ESG con <strong>garantía diaria y creciente</strong>. Tus beneficios quedan protegidos cada día.`,
    hb:{t:'hbp',x:'<strong>Diferencial único:</strong> Garantía diaria y creciente. Fondos sostenibles ESG. Beneficios consolidados automáticamente cada día.'},
    sts:[{v:'Diaria',l:'Frecuencia garantía'},{v:'ESG',l:'Inversión sostenible'},{v:'Creciente',l:'Protección beneficios'}],
    covs:[{n:'Garantía diaria sobre valor invertido',c:'Creciente',p:'✓',k:true,t:'único'},{n:'Fondos sostenibles ESG',c:'100%',p:'✓',k:true,t:'diferencial'},{n:'Consolidación diaria de beneficios',c:'Automática',p:'✓',k:false},{n:'Cobertura fallecimiento',c:'Capital invertido',p:'—',k:false},{n:'Rescate parcial',c:'A partir año 2',p:'—',k:false}],
    tdesc:'Aportación mensual elegida · Garantía diaria y creciente',prima:'Desde 100 €/mes',
    cierre:n=>`<strong>${n}</strong>, invertir de forma ética con garantías diarias. Empezamos con la aportación que elijas.`},

  // FASE 2
  saludvida:{fase:'Fase 2 · Salud, Vida y Accidentes',fb:'fbo',ico:'❤️',nom:'Plan Salud + Vida',sub:'Solución híbrida única: salud y vida en un solo contrato.',col:'o',
    tit:n=>`La protección completa de <em>${n} y su familia</em> en un solo contrato.`,
    greet:n=>`Hola <strong>${n}</strong>,<br><br>El producto estrella de NN: <strong>medicina privada Sanitas + seguro de vida gratis el primer año</strong>. Protección total con ahorro inmediato.`,
    hb:{t:'hbo',x:'<strong>Oferta exclusiva:</strong> Al contratar la cobertura de salud de Sanitas, el seguro de vida es GRATIS el primer año.'},
    covs:[{n:'Seguro de salud Sanitas completo',c:'Familia completa',p:'Desde 80 €/mes',k:true,t:'estrella'},{n:'Seguro de vida 1er año GRATIS',c:'Capital a elegir',p:'0 € primer año',k:true,t:'gratis'},{n:'Medicina familiar y especialistas',c:'Acceso directo',p:'✓',k:false},{n:'Hospitalización y urgencias 24h',c:'Incluido',p:'✓',k:false},{n:'Cobertura dental',c:'Incluida',p:'✓',k:false},{n:'Pruebas diagnósticas',c:'Sin límite',p:'✓',k:false}],
    tdesc:'Prima variable según edad y coberturas · Vida incluido gratis el 1er año',prima:'Desde 80 €/mes',
    cierre:n=>`<strong>${n}</strong>, medicina privada Sanitas más vida gratis el primer año. La decisión que marca la diferencia.`},

  saludcompleto:{fase:'Fase 2 · Salud, Vida y Accidentes',fb:'fbo',ico:'🏥',nom:'Seguro de Salud Completo',sub:'Cobertura médica total con acceso directo a red Sanitas.',col:'o',
    tit:n=>`La medicina privada de <em>${n}</em>, sin esperas y sin límites.`,
    greet:n=>`Hola <strong>${n}</strong>,<br><br>Sanitas completo: <strong>medicina familiar, especialidades, hospitalización, urgencias 24h y dental</strong>. La cobertura más amplia del mercado.`,
    hb:{t:'hbo',x:'<strong>Red Sanitas:</strong> Más de 40.000 profesionales y 1.000 centros en España. Sin listas de espera. Sin burocracia.'},
    covs:[{n:'Medicina familiar',c:'Acceso directo',p:'✓',k:true,t:'incluido'},{n:'Especialidades médicas',c:'Sin límite',p:'✓',k:true,t:'incluido'},{n:'Hospitalización completa',c:'Incluida',p:'✓',k:false},{n:'Urgencias 24h',c:'Incluidas',p:'✓',k:false},{n:'Pruebas diagnósticas',c:'Sin límite',p:'✓',k:false},{n:'Cobertura dental',c:'Incluida',p:'✓',k:false}],
    tdesc:'Prima variable según edad y zona · Red Sanitas completa',prima:'A consultar',
    cierre:n=>`<strong>${n}</strong>, con Sanitas tienes respuesta inmediata cuando la necesitas.`},

  saludcopago:{fase:'Fase 2 · Salud, Vida y Accidentes',fb:'fbo',ico:'💊',nom:'Salud con Copago',sub:'Medicina privada Sanitas con prima reducida y pago por uso.',col:'o',
    tit:n=>`La medicina privada de Sanitas para ${n}, <em>al precio que le encaja.</em>`,

  let h=`<div class="hero fi"><div class="g1"></div><div class="g2"></div><div class="htop"><div class="hbrand"><div class="bdot">N</div><span class="bname">Nationale-Nederlanden</span></div></div><div class="hpt">Portal de Propuestas · Fede Fontanals</div><h1 class="htit">Selecciona la <em>propuesta</em> que quieres ver.</h1><p class="hsub">Cada propuesta se personaliza con el nombre y los datos del cliente.</p></div>${strip()}<div class="body fi"><div class="greet">Bienvenido al portal de propuestas de <strong>Federico Fontanals</strong>, Agente Dinamizador NN Xàtiva. Selecciona el producto para ver la propuesta completa.</div>`;
  for(const[f,ps] of Object.entries(fases)){h+=`<div class="pht">${f}</div>`;ps.forEach(p=>{h+=`<a class="pc" href="?producto=${p.k}"><span class="pi">${p.i}</span><div><div class="pn">${p.n}</div><div class="pd">${p.d}</div></div><span class="pa">›</span></a>`;});}
  h+=`<div class="pht">🤝 Para Agentes</div><a class="pc" href="?seccion=agente"><span class="pi">🤝</span><div><div class="pn">Oportunidad de negocio NN</div><div class="pd">Presentación para candidatos a agente</div></div><span class="pa">›</span></a></div>${foot()}`;
  return h;
}

function main(){
  const sec=q('seccion'),prod=q('producto').toLowerCase(),n=q('nombre')||q('name'),p=q('prima')||q('price'),app=document.getElementById('app');
  if(sec==='agente')app.innerHTML=renderAgente(n);
  else if(prod&&PRODS[prod])app.innerHTML=renderProd(PRODS[prod],n,p);
  else app.innerHTML=renderPortada();
}

window.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>{main();document.getElementById('app').style.display='block';const l=document.getElementById('loader');l.classList.add('off');setTimeout(()=>l.remove(),500);},700);
});
</script>
