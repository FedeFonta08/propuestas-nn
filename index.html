:root {
  --orange:   #C94D00;
  --orange-l: #E85C0D;
  --dark:     #F5F5F0;
  --navy:     #FFFFFF;
  --navy2:    #FFF8F5;
  --navy3:    #FFF0E8;
  --green:    #16A34A;
  --green-d:  #15803D;
  --blue:     #1D4ED8;
  --amber:    #B45309;
  --red:      #B91C1C;
  --purple:   #6D28D9;
  --teal:     #0F766E;
  --white:    #FFFFFF;
  --text:     #111827;
  --text2:    #374151;
  --text3:    #6B7280;
  --border:   rgba(0,0,0,0.10);
  --border2:  rgba(0,0,0,0.18);
  --card:     rgba(0,0,0,0.03);
  --r:        14px;
  --r-lg:     20px;
}

*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #F5F5F0;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 10% 0%, rgba(201,77,0,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 100%, rgba(29,78,216,0.03) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ── HEADER ─────────────────────────────────── */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #FFFFFF;
  backdrop-filter: none;
  border-bottom: 2px solid var(--orange);
  padding: 0 2rem;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo-box {
  width: 36px; height: 36px;
  background: var(--orange);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.logo-box svg { width: 18px; height: 18px; }

.logo-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 21px;
  letter-spacing: 1.5px;
  color: #111827;
  line-height: 1;
}

.logo-sub {
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.5px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.clock {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  color: #111827;
  letter-spacing: 1px;
  min-width: 90px;
  text-align: right;
}

.date-label {
  font-size: 10px;
  color: var(--text3);
  text-align: right;
  margin-top: -1px;
}

/* ── HERO SALUDO ─────────────────────────────── */
.hero {
  position: relative;
  z-index: 1;
  padding: 2.5rem 2rem 1.5rem;
  max-width: 1280px;
  margin: 0 auto;
}

.hero-top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 2rem;
  margin-bottom: 1.5rem;
}

.saludo {
  font-size: 13px;
  color: var(--orange);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 600;
  margin-bottom: 4px;
}
