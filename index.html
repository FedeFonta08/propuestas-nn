<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propuesta · Nationale-Nederlanden · Fede Fontanals</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--o:#E85D26;--ol:#FBF0EC;--om:#F4A07A;--od:#C44A18;--g:#0F6E56;--gl:#E4F4EF;--b:#1A4FAB;--bl:#EAF0FB;--p:#6B3FA0;--pl:#F0EAF8;--t:#0E7490;--tl:#E0F2F7;--dk:#1C1714;--tx:#2A2420;--t2:#6A5F5A;--t3:#9A8F87;--br:#EDE8E3;--bg:#F5F0EB;--wh:#FFF;--r:16px;--rs:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
#loader{position:fixed;inset:0;background:var(--dk);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:999;transition:opacity .4s}
#loader.off{opacity:0;pointer-events:none}
.ld{width:38px;height:38px;background:var(--o);border-radius:50%;animation:pu 1.2s ease-in-out infinite}
.lt{font-size:12px;color:rgba(255,255,255,.35);letter-spacing:.08em}
@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.5}}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
/* HERO */
.hero{background:var(--dk);border-radius:var(--r) var(--r) 0 0;padding:36px 36px 32px;position:relative;overflow:hidden}
.g1{position:absolute;top:-80px;right:-80px;width:280px;height:280px;background:radial-gradient(circle,rgba(232,93,38,.22) 0%,transparent 65%);border-radius:50%}
.g2{position:absolute;bottom:-60px;left:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(232,93,38,.1) 0%,transparent 65%);border-radius:50%}
.htop{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;position:relative;z-index:1}
.hbrand{display:flex;align-items:center;gap:10px}
.bdot{width:34px;height:34px;background:var(--o);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:#fff}
.bname{font-size:12px;color:rgba(255,255,255,.4);letter-spacing:.07em;text-transform:uppercase}
.hbadge{font-size:10px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.45);padding:4px 10px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase}
.hpt{font-size:11px;color:var(--o);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;position:relative;z-index:1}
.htit{font-family:'Fraunces',serif;font-size:30px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:12px;position:relative;z-index:1}
.htit em{color:var(--o);font-style:normal}
.hsub{font-size:13.5px;color:rgba(255,255,255,.5);line-height:1.6;position:relative;z-index:1;max-width:420px}
/* AGENT STRIP */
.astrip{background:rgba(255,255,255,.05);border-top:1px solid rgba(255,255,255,.07);padding:14px 36px;display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.aav{width:38px;height:38px;border-radius:50%;background:var(--o);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:#fff}
.aav img{width:100%;height:100%;object-fit:cover}
.an{font-size:13px;font-weight:600;color:rgba(255,255,255,.85)}
.ar{font-size:11px;color:rgba(255,255,255,.4);margin-top:1px}
.ac{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ac a{font-size:11px;color:rgba(255,255,255,.4);text-decoration:none;transition:color .15s}
.ac a:hover{color:var(--o)}
/* BODY */
.body{background:var(--wh);padding:32px 36px}
.greet{font-size:15px;color:var(--tx);line-height:1.75;margin-bottom:28px;padding-bottom:28px;border-bottom:1px solid var(--br)}
.greet strong{font-weight:600;color:var(--dk)}
/* LABELS */
.sl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;margin-bottom:12px}
.slo{color:var(--o)}.slg{color:var(--g)}.slb{color:var(--b)}.slp{color:var(--p)}.slt{color:var(--t)}
/* FASE BADGE */
.fbadge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:20px}
.fbo{background:var(--ol);color:var(--od)}.fbb{background:var(--bl);color:var(--b)}.fbp{background:var(--pl);color:var(--p)}.fbt{background:var(--tl);color:var(--t)}.fbg{background:var(--gl);color:var(--g)}
/* PENDIENTE BOX */
.pend{background:#FAF7F5;border:1.5px dashed var(--br);border-radius:var(--rs);padding:20px;text-align:center;margin-bottom:24px}
.pend-ico{font-size:28px;margin-bottom:8px}
.pend-title{font-size:14px;font-weight:600;color:var(--t2);margin-bottom:6px}
.pend-desc{font-size:12px;color:var(--t3);line-height:1.6}
/* HIGHLIGHT BOX */
.hbox{border-radius:var(--rs);padding:14px 16px;margin-bottom:20px;font-size:13.5px;line-height:1.6}
.hbo{background:var(--ol);border-left:3px solid var(--o);color:var(--od)}
.hbb{background:var(--bl);border-left:3px solid var(--b);color:var(--b)}
.hbg{background:var(--gl);border-left:3px solid var(--g);color:var(--g)}
.hbp{background:var(--pl);border-left:3px solid var(--p);color:var(--p)}
.hbt{background:var(--tl);border-left:3px solid var(--t);color:var(--t)}
.hbox strong{font-weight:600}
/* STATS */
.st-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stc{background:#FAF7F5;border:1px solid var(--br);border-radius:var(--rs);padding:14px 12px;text-align:center}
.stv{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--dk);line-height:1;margin-bottom:4px}
.stl{font-size:11px;color:var(--t3);line-height:1.3}
/* GAP */
.gap-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:28px}
.gc{background:#FAF7F5;border:1px solid var(--br);border-radius:var(--rs);padding:16px 14px;text-align:center}
.gc.hot{background:var(--ol);border-color:var(--om)}
.gn{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--dk);line-height:1;margin-bottom:5px}
.gc.hot .gn{color:var(--o)}
.gl2{font-size:11px;color:var(--t3);line-height:1.3}
/* COBERTURAS */
.cl{border:1px solid var(--br);border-radius:var(--rs);overflow:hidden;margin-bottom:16px}
.cr{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--br);background:var(--wh)}
.cr:last-child{border-bottom:none}
.cr.ko{background:var(--ol)}.cr.kb{background:var(--bl)}.cr.kg{background:var(--gl)}.cr.kp{background:var(--pl)}.cr.kt{background:var(--tl)}
.cn{font-size:13px;color:var(--tx);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.to{background:var(--o);color:#fff}.tb{background:var(--b);color:#fff}.tg{background:var(--g);color:#fff}.tp{background:var(--p);color:#fff}.tt{background:var(--t);color:#fff}
.crr{display:flex;align-items:center;gap:14px}
.cc{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.cp{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;min-width:52px;text-align:right;font-family:'DM Mono',monospace}
.cp.co{color:var(--o)}.cp.cb{color:var(--b)}.cp.cg{color:var(--g)}.cp.cp2{color:var(--p)}.cp.ct{color:var(--t)}
/* TOTAL */
.total{background:var(--dk);border-radius:var(--rs);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.tll{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.tld{font-size:12px;color:rgba(255,255,255,.45);line-height:1.4}
.trp{font-family:'Fraunces',serif;font-size:32px;font-weight:700;color:var(--o)}
.trs{font-size:10px;color:rgba(255,255,255,.3);text-align:right;margin-top:3px}
/* DIV */
.dv{height:1px;background:var(--br);margin:0 0 28px}
/* EXTRAS */
.extras{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.ep{background:var(--gl);border-radius:var(--rs);padding:13px 15px;display:flex;gap:10px;align-items:flex-start}
.ei{font-size:20px;flex-shrink:0;margin-top:1px}
.et{font-size:13px;font-weight:600;color:var(--g)}
.ed{font-size:11px;color:#2A6454;margin-top:2px;line-height:1.4}
/* CIERRE */
.cierre{font-size:14px;color:var(--tx);line-height:1.75;margin-bottom:24px}
.cierre strong{font-weight:600;color:var(--dk)}
/* CTA */
.cta{text-align:center;margin-bottom:28px}
.ctab{display:inline-block;background:var(--o);color:#fff;font-size:14px;font-weight:600;padding:15px 36px;border-radius:100px;text-decoration:none;letter-spacing:.02em;box-shadow:0 4px 20px rgba(232,93,38,.35);transition:transform .15s,box-shadow .15s}
.ctab:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(232,93,38,.45)}
/* FOOTER */
.foot{background:#EDE8E3;border-radius:0 0 var(--r) var(--r);padding:20px 36px;text-align:center}
.foot p{font-size:11px;color:var(--t3);line-height:1.6}
/* PORTADA */
.pc{background:var(--wh);border:1.5px solid var(--br);border-radius:var(--rs);padding:16px 20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:14px;text-decoration:none;margin-bottom:8px}
.pc:hover{border-color:var(--o);background:var(--ol)}
.pi{font-size:24px;flex-shrink:0}
.pn{font-size:14px;font-weight:600;color:var(--dk)}
.pd{font-size:12px;color:var(--t3);margin-top:2px}
.pa{margin-left:auto;font-size:20px;color:var(--t3)}
.pend-tag{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:600;background:#FAF7F5;color:var(--t3);margin-left:6px;vertical-align:middle;text-transform:uppercase;letter-spacing:.04em}
.pht{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--br)}
/* AGENTE */
.ogg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.ogc{background:#FAF7F5;border:1px solid var(--br);border-radius:var(--rs);padding:16px;text-align:center}
.ogi{font-size:24px;margin-bottom:8px}
.ogv{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--dk);margin-bottom:4px}
.ogl{font-size:11px;color:var(--t3);line-height:1.3}
.spl{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.spi{display:flex;gap:14px;align-items:flex-start;background:#FAF7F5;border:1px solid var(--br);border-radius:var(--rs);padding:14px 16px}
.spn{width:26px;height:26px;border-radius:50%;background:var(--o);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.spb{font-size:13.5px;color:var(--tx);line-height:1.55}
.spb strong{font-weight:600}
.spno{font-size:12px;color:var(--t3);margin-top:3px}
.pr{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.pi2{font-size:12px;font-weight:500;padding:6px 14px;border-radius:20px}
.pi2.o{background:var(--ol);color:var(--od)}.pi2.g{background:var(--gl);color:var(--g)}.pi2.b{background:var(--bl);color:var(--b)}
/* ANIMATIONS */
.fi{opacity:0;transform:translateY(14px);animation:fu .5s ease forwards}
@keyframes fu{to{opacity:1;transform:translateY(0)}}
.fi:nth-child(1){animation-delay:.05s}.fi:nth-child(2){animation-delay:.15s}.fi:nth-child(3){animation-delay:.25s}.fi:nth-child(4){animation-delay:.35s}
@media(max-width:500px){
  .hero,.body,.foot,.astrip{padding-left:20px;padding-right:20px}
  .htit{font-size:24px}
  .gap-row,.st-row,.ogg,.extras{grid-template-columns:1fr}
  .total{flex-direction:column;gap:12px;text-align:center}
  .trs,.trp{text-align:center}
  .cc{display:none}
  .ac{display:none}
}
</style>
</head>
<body>
<div id="loader"><div class="ld"></div><div class="lt">Preparando tu propuesta…</div></div>
<div class="wrap" id="app" style="display:none"></div>
<script>
// ═══════════════════════════════════════════════════════════════
// ESTRUCTURA REAL — GUÍA MAESTRA NN
// Los datos marcados con DATA_PENDIENTE se actualizarán cuando
// llegue documentación oficial de cada producto.
// ═══════════════════════════════════════════════════════════════

const FASES = {
  'f1': { label: 'Fase 1 · Ahorro e Inversión', ico: '💰', col: 'p', fb: 'fbp', sl: 'slp' },
  'f2': { label: 'Fase 2 · Salud, Vida y Accidentes', ico: '❤️', col: 'o', fb: 'fbo', sl: 'slo' },
  'f3': { label: 'Fase 3 · Hogar y Automóvil', ico: '🏠', col: 't', fb: 'fbt', sl: 'slt' },
  'f4': { label: 'Fase 4 · Pensiones', ico: '🏦', col: 'b', fb: 'fbb', sl: 'slb' },
  'f5': { label: 'Fase 5 · Profesional y Empresa', ico: '💼', col: 'o', fb: 'fbo', sl: 'slo' },
  'f6': { label: 'Fase 6 · Hipotecas', ico: '🏡', col: 'g', fb: 'fbg', sl: 'slg' },
};

const PRODS = {

  // ── FASE 1: AHORRO E INVERSIÓN ─────────────────────────────────────
  sialp: {
    fase: 'f1', ico: '📊', nom: 'Plan SIALP',
    sub: 'Seguro Individual de Ahorro a Largo Plazo con exención fiscal total de los rendimientos.',
    tit: n => `El ahorro que hace crecer <em>el dinero de ${n}</em> sin pagar a Hacienda.`,
    greet: n => `Hola <strong>${n}</strong>,<br><br>El Plan SIALP es la herramienta de ahorro más eficiente del mercado: <strong>exención fiscal total de los rendimientos generados</strong> siempre que la inversión se mantenga un mínimo de 5 años y con una aportación máxima de 5.000 € anuales.`,
    hb: { t: 'hbp', x: '<strong>Ventaja fiscal clave:</strong> Exención total de los rendimientos generados. Aportación máxima 5.000 €/año. Sin tributación al vencimiento.' },
    pendiente: true,
    pendDesc: 'Datos de primas y capitales pendientes de documentación oficial. Se actualizarán en cuanto se suba la ficha de producto.',
    cierre: n => `<strong>${n}</strong>, ahorrar sin pagar impuestos es la decisión más inteligente. Hablamos para ver cuánto quieres aportar.`,
  },

  flexible: {
    fase: 'f1', ico: '🌍', nom: 'Plan Flexible (Unit Linked)',
    sub: 'Inversión internacional dinámica para maximizar el crecimiento del capital sin vencimiento fijo.',
    tit: n => `La inversión internacional que hace <em>trabajar el dinero de ${n}</em>.`,
    greet: n => `Hola <strong>${n}</strong>,<br><br>El Plan Flexible es para quien quiere que su dinero crezca por encima de la inflación: <strong>gestión dinámica de activos en mercados internacionales</strong>, sin vencimiento fijo y con total flexibilidad de rescate.`,
    hb: { t: 'hbp', x: '<strong>Perfil:</strong> Inversores con alta tolerancia al riesgo que necesitan una herramienta potente para batir la inflación y hacer crecer su patrimonio de forma activa.' },
    pendiente: true,
    pendDesc: 'Datos de rentabilidades, comisiones y condiciones pendientes de documentación oficial.',
    cierre: n => `<strong>${n}</strong>, tu dinero puede trabajar más que tú. Analizamos juntos el perfil que mejor te encaja.`,
  },

  garantizado: {
    fase: 'f1', ico: '🔒', nom: 'Plan Garantizado de Inversión',
    sub: 'Inversión internacional con garantía contractual del 100% del capital aportado al vencimiento.',
    tit: n => `La inversión de ${n} <em>con garantía absoluta</em> del capital.`,
    greet: n => `Hola <strong>${n}</strong>,<br><br>El Plan Garantizado permite participar en mercados internacionales <strong>sin arriesgar ni un euro del capital invertido</strong>. Al vencimiento, el 100% del capital aportado está garantizado por contrato.`,
    hb: { t: 'hbp', x: '<strong>Garantía contractual:</strong> 100% del capital garantizado al vencimiento. Perfil conservador que quiere rentabilidad sin riesgo de pérdida del principal.' },
    pendiente: true,
    pendDesc: 'Condiciones de vencimiento, rentabilidad potencial y límites de aportación pendientes de documentación oficial.',
    cierre: n => `<strong>${n}</strong>, la tranquilidad de saber que no puedes perder lo invertido. Esta es tu herramienta.`,
  },

  flexicuenta: {
    fase: 'f1', ico: '💰', nom: 'Flexicuenta (Plan Ahorro Remunerado)',
    sub: 'Cuenta de ahorro con rentabilidad garantizada y disponibilidad total inmediata sin penalización.',
    tit: n => `El ahorro de ${n} <em>siempre disponible</em> y siempre rentable.`,
    greet: n => `Hola <strong>${n}</strong>,<br><br>La Flexicuenta es el fondo de emergencia perfecto: <strong>rentabilidad garantizada desde el primer día y disponibilidad total del dinero sin penalización</strong>. Líquido cuando lo necesitas, rentable mientras no lo usas.`,
    hb: { t: 'hbp', x: '<strong>Ventaja única:</strong> Disponibilidad total e inmediata SIN ninguna penalización por rescate. Rentabilidad garantizada desde el día 1. Ideal como fondo de emergencia o punto de entrada inversor.' },
    pendiente: true,
    pendDesc: 'Tipo de rentabilidad garantizada y condiciones de aportación pendientes de documentación oficial.',
    cierre: n => `<strong>${n}</strong>, un colchón que renta mientras duermes es la base de cualquier estrategia económica.`,
  },

  ahorrogarantizado: {
    fase: 'f1', ico: '🏦', nom: 'Plan de Ahorro Garantizado',
    sub: 'Acumulación sistemática de capital con rentabilidad mínima asegurada por contrato.',
    tit: n => `El ahorro de ${n} <em>con rentabilidad mínima garantizada</em> por contrato.`,
    greet: n => `Hola <strong>${n}</strong>,<br><br>El Plan de Ahorro Garantizado establece una <strong>rentabilidad mínima asegurada por contrato</strong>, permitiendo conocer de antemano el crecimiento mínimo del ahorro. Ideal para objetivos concretos a medio y largo plazo.`,
    hb: { t: 'hbp', x: '<strong>Previsibilidad total:</strong> Rentabilidad mínima garantizada por contrato. Perfil de bajo riesgo con objetivos de ahorro concretos a medio o largo plazo.' },

  futuro: {
    fase: 'f1', ico: '📈', nom: 'Contigo Futuro',
    sub: 'Seguro de ahorro-inversión Unit Linked sostenible ESG con garantía diaria y creciente.',
    tit: n => `El plan de ahorro que hace crecer <em>el dinero de ${n}</em> con garantías diarias.`,
    greet: n => `Hola <strong>${n}</strong>,<br><br>Contigo Futuro combina inversión sostenible ESG con una característica única en el mercado: <strong>garantía diaria y creciente sobre el valor de la inversión</strong>. Tus beneficios se consolidan y protegen cada día.`,
    hb: { t: 'hbp', x: '<strong>Diferencial único:</strong> Garantía diaria y creciente sobre el valor invertido. Fondos sostenibles ESG. Los beneficios generados quedan protegidos automáticamente cada día.' },
    pendiente: true,
    pendDesc: 'Datos de rentabilidades históricas, comisiones y condiciones de rescate pendientes de documentación oficial.',
    cierre: n => `<strong>${n}</strong>, invertir de forma ética y con garantías diarias. Empezamos con la aportación que elijas.`,
  },

  // ── FASE 2: SALUD, VIDA Y ACCIDENTES ──────────────────────────────
  saludvida: {
    fase: 'f2', ico: '❤️', nom: 'Plan Salud + Vida',
    sub: 'Solución híbrida única en el mercado: asistencia sanitaria Sanitas + seguro de vida en un contrato.',
    tit: n => `La protección completa de <em>${n} y su familia</em> en un solo contrato.`,
    greet: n => `Hola <strong>${n}</strong>,<br><br>El producto estrella de NN: <strong>medicina privada Sanitas más seguro de vida, con el seguro de vida gratis el primer año</strong>. La solución más completa del mercado para una familia.`,
    hb: { t: 'hbo', x: '<strong>Oferta única del mercado:</strong> Al contratar la cobertura de salud de Sanitas, el seguro de vida es GRATIS el primer año. Protección total con ahorro inmediato.' },
    covs: [
      { n: 'Asistencia sanitaria completa Sanitas', c: 'Familia completa', p: 'Consultar', k: true, t: 'estrella' },
      { n: 'Seguro de vida — 1er año GRATIS', c: 'Capital a elegir', p: '0 € primer año', k: true, t: 'gratis' },
      { n: 'Medicina familiar y especialistas', c: 'Acceso directo', p: '✓', k: false },
      { n: 'Hospitalización y urgencias 24h', c: 'Incluido', p: '✓', k: false },
      { n: 'Pruebas diagnósticas', c: 'Sin límite', p: '✓', k: false },
      { n: 'Cobertura dental', c: 'Incluida', p: '✓', k: false },
    ],

function colMap(c){ return { o:'o', b:'b', g:'g', p:'p', t:'t' }[c]||'o'; }
function keyClass(c){ return `k${colMap(c)}`; }
function tagClass(c){ return `t${colMap(c)}`; }
function priceClass(c){ return `c${colMap(c)}`; }

// RENDER PRODUCTO
// ═══════════════════════════════════════════════════════════════
function renderProd(p, nombre, prima){
  const n = nombre || 'tu propuesta';
  const pf = prima || p.prima || 'Consultar';
  const f = FASES[p.fase];
  const KC = keyClass(f.col), TC = tagClass(f.col), PC = priceClass(f.col);

  const gapH = p.gap ? `
    <div class="sl slo">El agujero real del RETA</div>
    <div class="gap-row">
      <div class="gc"><div class="gn">${p.gd.g}</div><div class="gl2">${p.gls[0]}</div></div>
      <div class="gc"><div class="gn">${p.gd.r}</div><div class="gl2">${p.gls[1]}</div></div>
      <div class="gc hot"><div class="gn">${p.gd.h}</div><div class="gl2">${p.gls[2]}</div></div>
    </div><div class="dv"></div>` : '';

  const hbH = p.hb ? `<div class="hbox ${p.hb.t}">${p.hb.x}</div>` : '';
  const stH = p.sts ? `<div class="st-row">${p.sts.map(s=>`<div class="stc"><div class="stv">${s.v}</div><div class="stl">${s.l}</div></div>`).join('')}</div>` : '';

  const pendH = p.pendiente ? `
    <div class="pend">
      <div class="pend-ico">📋</div>
      <div class="pend-title">Datos detallados en preparación</div>
      <div class="pend-desc">${p.pendDesc}</div>
    </div>` : '';

  const covsH = p.covs ? `
    <div class="sl sl${colMap(f.col)}">Qué incluye tu propuesta</div>
    <div class="cl">${p.covs.map(c=>`
      <div class="cr ${c.k ? KC : ''}">
        <span class="cn">${c.n}${c.k?`<span class="tag ${TC}">${c.t}</span>`:''}</span>
        <div class="crr"><span class="cc">${c.c}</span><span class="cp ${PC}">${c.p}</span></div>
      </div>`).join('')}</div>` : '';

  const totalH = !p.pendiente && p.totalDesc ? `
    <div class="total">
      <div><div class="tll">Prima estimada</div><div class="tld">${p.totalDesc}</div></div>
      <div><div class="trp">${pf}</div><div class="trs">al mes</div></div>
    </div>` : '';

  return `
  <div class="hero fi"><div class="g1"></div><div class="g2"></div>
    <div class="htop">
      <div class="hbrand"><div class="bdot">N</div><span class="bname">Nationale-Nederlanden</span></div>
      <span class="hbadge">${p.ico} ${p.nom}</span>
    </div>
    <div class="hpt">${p.nom} · Propuesta personalizada</div>
    <h1 class="htit">${p.tit(n)}</h1>
    <p class="hsub">${p.sub}</p>
  </div>
  ${strip()}
  <div class="body fi">
    <div class="greet">${p.greet(n)}</div>
    <span class="fbadge ${f.fb}">${f.ico} ${f.label}</span>
    ${gapH}${hbH}${stH}${pendH}${covsH}${totalH}
    ${exts()}
    <div class="dv"></div>
    <div class="cierre">${p.cierre(n)}</div>
    <div class="cta"><a href="tel:+34680507186" class="ctab">Llamar a Fede · 680 507 186</a></div>
  </div>
  ${foot()}`;
}

// RENDER PORTADA
// ═══════════════════════════════════════════════════════════════
function renderPortada(){
  let h = `
  <div class="hero fi"><div class="g1"></div><div class="g2"></div>
    <div class="htop"><div class="hbrand"><div class="bdot">N</div><span class="bname">Nationale-Nederlanden</span></div></div>
    <div class="hpt">Portal de Propuestas · Fede Fontanals</div>
    <h1 class="htit">Selecciona la <em>propuesta</em> que quieres ver.</h1>
    <p class="hsub">Cada propuesta se personaliza con el nombre y los datos del cliente.</p>
  </div>
  ${strip()}
  <div class="body fi">
    <div class="greet">Bienvenido al portal de propuestas de <strong>Federico Fontanals</strong>, Agente Dinamizador NN Xàtiva. Selecciona el producto para ver la propuesta completa.</div>`;

  for(const [fase, prods] of Object.entries(PORTADA_FASES)){
    h += `<div class="pht">${fase}</div>`;
    prods.forEach(k => {
      const p = PRODS[k];
      if(!p) return;
      const pendTag = p.pendiente ? `<span class="pend-tag">En actualización</span>` : '';
      h += `<a class="pc" href="?producto=${k}">
        <span class="pi">${p.ico}</span>
        <div><div class="pn">${p.nom}${pendTag}</div><div class="pd">${p.sub.split('.')[0]}.</div></div>
        <span class="pa">›</span>
      </a>`;
    });
  }

  h += `<div class="pht">🤝 Para Agentes</div>
    <a class="pc" href="?seccion=agente">
      <span class="pi">🤝</span>
      <div><div class="pn">Oportunidad de negocio NN</div><div class="pd">Presentación personalizada para candidatos a agente.</div></div>
      <span class="pa">›</span>
    </a>
  </div>${foot()}`;

  return h;
}

// ═══════════════════════════════════════════════════════════════
// MAIN
// ═══════════════════════════════════════════════════════════════
function main(){
  const sec = q('seccion'), prod = q('producto').toLowerCase();
  const nombre = q('nombre') || q('name');
  const prima = q('prima') || q('price');
  const app = document.getElementById('app');

  if(sec === 'agente') app.innerHTML = renderAgente(nombre);
  else if(prod && PRODS[prod]) app.innerHTML = renderProd(PRODS[prod], nombre, prima);
  else app.innerHTML = renderPortada();
}

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    main();
    document.getElementById('app').style.display = 'block';
    const l = document.getElementById('loader');
    l.classList.add('off');
    setTimeout(() => l.remove(), 500);
  }, 700);
});
</script>
