<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="es">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Propuesta Consultiva NN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style type="text/css">
    body { margin: 0; padding: 0; min-width: 100%; background-color: #F8F6F4; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #1C1714; }
    table { border-spacing: 0; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    td { padding: 0; }
    img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; display: block; }
    
    /* Fix para que los móviles no pinten los teléfonos de azul */
    a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: none !important;
        font-size: inherit !important;
        font-family: inherit !important;
        font-weight: inherit !important;
        line-height: inherit !important;
    }
    .phone-link a { color: #ffffff !important; text-decoration: none !important; }
</style>
</head>
<body style="margin: 0; padding: 0; background-color: #F8F6F4;">
    <div style="display: none; max-height: 0px; overflow: hidden;">{{PREHEADER}}</div>

    <center style="width: 100%; background-color: #F8F6F4; padding: 25px 0;">
        
        <!-- 1. CABECERA -->
        {{BRAND_HEADER_BLOCK}}
        
        <!-- 2. IDENTIDAD (HTML Nítido) -->
        {{AGENT_HEADER_HTML}}

        <!-- 3. PRODUCTO (Banner Maestro de Federico) -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" align="center" style="background-color: #ffffff; width: 100%; max-width: 600px;">
            <tr>
                <td align="center">
                    <img src="{{MASTER_BANNER_IMAGE}}" width="600" style="display: block; width: 100%; max-width: 600px; height: auto; border: 0;" alt="Propuesta Salud">
                </td>
            </tr>
        </table>

        <!-- 4. MENSAJE EDITORIAL -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" align="center" style="background-color: #ffffff;">
            <tr>
                <td style="padding: 35px 50px 25px 50px; background-color: #ffffff;">
                    <div style="font-family: 'Georgia', serif; font-size: 26px; font-weight: 700; color: #1C1714; margin-bottom: 12px;">Hola {{NOMBRE}},</div>
                    <div style="font-size: 17px; font-weight: 700; color: #E85D26; margin-bottom: 10px; line-height: 1.3;">{{OFERTA_TITULO}}</div>
                    <div style="font-size: 14px; color: #4A4440; line-height: 1.6; text-align: justify; margin-bottom: 15px;">{{PAIN_POINT_TEXT}}</div>
                    
                    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #FDFCFB; border-left: 3px solid #E85D26;">
                        <tr>
                            <td style="padding: 15px 20px; font-family: 'Georgia', serif; font-style: italic; font-size: 14px; color: #5A5048; line-height: 1.5;">
                                {{EMPATHY_LINE}}
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>

        <!-- 5. ACCIÓN -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" align="center" style="background-color: #ffffff; padding-bottom: 25px;">
            <tr>
                <td align="center" style="padding: 20px 50px 25px 50px;">
                    <a href="{{CTA_LINK}}" style="background-color: #E85D26; color: #ffffff !important; padding: 18px 50px; border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 16px; display: inline-block; box-shadow: 0 8px 25px rgba(232,93,38,0.4); text-transform: uppercase; letter-spacing: 1px;">{{CTA_TEXT}}</a>
                </td>
            </tr>
            <tr>
                <td style="padding: 0 50px 20px 50px;">
                    <div style="font-size: 9px; font-weight: 700; color: #8B7D75; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; border-bottom: 1px solid #EEE9E5; padding-bottom: 6px; text-align: left;">RESPUESTAS CLAVE</div>
                    {{FAQ_BLOCK}}
                </td>
            </tr>
        </table>

        <!-- 6. AUTORIDAD (Miniaturizada) -->
        {{AUTHORITY_BLOCK}}

        <!-- 7. EL FOOTER PERFECTO -->
        {{FOOTER_BLOCK}}

    </center>
</body>
</html>
