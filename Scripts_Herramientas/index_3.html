<style>
:root{--o:#E85D26;--ol:#FBF0EC;--om:#F4A07A;--od:#C44A18;--g:#0F6E56;--gl:#E4F4EF;--b:#1A4FAB;--bl:#EAF0FB;--p:#6B3FA0;--pl:#F0EAF8;--t:#0E7490;--tl:#E0F2F7;--dk:#1C1714;--tx:#2A2420;--t2:#6A5F5A;--t3:#9A8F87;--br:#EDE8E3;--bg:#F5F0EB;--wh:#FFF;--r:16px;--rs:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
#loader{position:fixed;inset:0;background:var(--dk);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:999;transition:opacity .4s}
#loader.off{opacity:0;pointer-events:none}
.ld{width:38px;height:38px;background:var(--o);border-radius:50%;animation:pu 1.2s ease-in-out infinite}
.lt{font-size:12px;color:rgba(255,255,255,.35);letter-spacing:.08em}
@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.5}}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
.hero{background:var(--dk);border-radius:var(--r) var(--r) 0 0;padding:36px 36px 32px;position:relative;overflow:hidden}
.g1{position:absolute;top:-80px;right:-80px;width:280px;height:280px;background:radial-gradient(circle,rgba(232,93,38,.22) 0%,transparent 65%);border-radius:50%}
.g2{position:absolute;bottom:-60px;left:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(232,93,38,.1) 0%,transparent 65%);border-radius:50%}
.htop{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;position:relative;z-index:1}
.hbrand{display:flex;align-items:center;gap:10px}
.bdot{width:34px;height:34px;background:var(--o);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:#fff}
.bname{font-size:12px;color:rgba(255,255,255,.4);letter-spacing:.07em;text-transform:uppercase}
.hbadge{font-size:10px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.45);padding:4px 10px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase}
.hpt{font-size:11px;color:var(--o);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;position:relative;z-index:1}
.htit{font-family:'Fraunces',serif;font-size:30px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:12px;position:relative;z-index:1}
.htit em{color:var(--o);font-style:normal}
.hsub{font-size:13.5px;color:rgba(255,255,255,.5);line-height:1.6;position:relative;z-index:1;max-width:420px}
.astrip{background:#2A2420;border-top:1px solid rgba(255,255,255,.1);padding:14px 36px;display:flex;align-items:center;gap:12px}
.aav{width:38px;height:38px;border-radius:50%;background:var(--o);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:#fff}
.aav img{width:100%;height:100%;object-fit:cover}
.an{font-size:13px;font-weight:600;color:#FFFFFF}
.ar{font-size:11px;color:rgba(255,255,255,.6);margin-top:1px}
.ac{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ac a{font-size:11px;color:rgba(255,255,255,.7);text-decoration:none}
.ac a:hover{color:var(--o)}
.body{background:var(--wh);padding:32px 36px}
.greet{font-size:15px;color:var(--tx);line-height:1.75;margin-bottom:28px;padding-bottom:28px;border-bottom:1px solid var(--br)}
.greet strong{font-weight:600;color:var(--dk)}
.sl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;margin-bottom:12px}
.slo{color:var(--o)}.slg{color:var(--g)}.slb{color:var(--b)}.slp{color:var(--p)}.slt{color:var(--t)}

.hbo{background:var(--ol);border-left:3px solid var(--o);color:var(--od)}
.hbb{background:var(--bl);border-left:3px solid var(--b);color:var(--b)}
.hbg{background:var(--gl);border-left:3px solid var(--g);color:var(--g)}
.hbp{background:var(--pl);border-left:3px solid var(--p);color:var(--p)}
.hbt{background:var(--tl);border-left:3px solid var(--t);color:var(--t)}
.hbox strong{font-weight:600}
.st-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stc{background:#FAF7F5;border:1px solid var(--br);border-radius:var(--rs);padding:14px 12px;text-align:center}
.stv{font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--dk);line-height:1;margin-bottom:4px}
.stl{font-size:11px;color:var(--t3);line-height:1.3}
.gap-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:28px}
.gc{background:#FAF7F5;border:1px solid var(--br);border-radius:var(--rs);padding:16px 14px;text-align:center}
.gc.hot{background:var(--ol);border-color:var(--om)}
.gn{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--dk);line-height:1;margin-bottom:5px}
.gc.hot .gn{color:var(--o)}
.gl2{font-size:11px;color:var(--t3);line-height:1.3}
.cl{border:1px solid var(--br);border-radius:var(--rs);overflow:hidden;margin-bottom:16px}
.cr{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--br);background:var(--wh)}

.tag{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

.cc{font-size:12px;color:var(--t3)}
.cp{font-size:13px;font-weight:600;min-width:52px;text-align:right;font-family:'DM Mono',monospace}

.total{background:var(--dk);border-radius:var(--rs);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}

.dv{height:1px;background:var(--br);margin:0 0 28px}
.extras{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.ep{background:var(--gl);border-radius:var(--rs);padding:13px 15px;display:flex;gap:10px;align-items:flex-start}
.ei{font-size:20px;flex-shrink:0;margin-top:1px}
.et{font-size:13px;font-weight:600;color:var(--g)}
.ed{font-size:11px;color:#2A6454;margin-top:2px;line-height:1.4}
.cierre{font-size:14px;color:var(--tx);line-height:1.75;margin-bottom:24px}

.cta{text-align:center;margin-bottom:28px}
.ctab{display:inline-block;background:var(--o);color:#fff;font-size:14px;font-weight:600;padding:15px 36px;border-radius:100px;text-decoration:none;letter-spacing:.02em;box-shadow:0 4px 20px rgba(232,93,38,.35);transition:transform .15s,box-shadow .15s}

.foot{background:#EDE8E3;border-radius:0 0 var(--r) var(--r);padding:20px 36px;text-align:center}
.foot p{font-size:11px;color:var(--t3);line-height:1.6}
.pc{background:var(--wh);border:1.5px solid var(--br);border-radius:var(--rs);padding:16px 20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:14px;text-decoration:none;margin-bottom:8px}
.pc:hover{border-color:var(--o);background:var(--ol)}
.pico{font-size:24px;flex-shrink:0}
.pn{font-size:14px;font-weight:600;color:var(--dk)}
.pd{font-size:12px;color:var(--t3);margin-top:2px}
.pa{margin-left:auto;font-size:20px;color:var(--t3)}
.pht{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--br)}
.ogg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.ogc{background:#FAF7F5;border:1px solid var(--br);border-radius:var(--rs);padding:16px;text-align:center}
.ogi{font-size:24px;margin-bottom:8px}
.ogv{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--dk);margin-bottom:4px}
.ogl{font-size:11px;color:var(--t3);line-height:1.3}
.spl{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.spi{display:flex;gap:14px;align-items:flex-start;background:#FAF7F5;border:1px solid var(--br);border-radius:var(--rs);padding:14px 16px}
.spn{width:26px;height:26px;border-radius:50%;background:var(--o);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.spb{font-size:13.5px;color:var(--tx);line-height:1.55}
.spb strong{font-weight:600}
.spno{font-size:12px;color:var(--t3);margin-top:3px}
.pr{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.pi2{font-size:12px;font-weight:500;padding:6px 14px;border-radius:20px}
.pi2.o{background:var(--ol);color:var(--od)}.pi2.g{background:var(--gl);color:var(--g)}.pi2.b{background:var(--bl);color:var(--b)}
.fi{opacity:0;transform:translateY(14px);animation:fu .5s ease forwards}
@keyframes fu{to{opacity:1;transform:translateY(0)}}
.fi:nth-child(1){animation-delay:.05s}.fi:nth-child(2){animation-delay:.15s}.fi:nth-child(3){animation-delay:.25s}.fi:nth-child(4){animation-delay:.35s}
@media(max-width:500px){
  .hero,.body,.foot,.astrip{padding-left:20px;padding-right:20px}
  .htit{font-size:24px}
  .gap-row,.st-row,.ogg,.extras{grid-template-columns:1fr}
  .total{flex-direction:column;gap:12px;text-align:center}
  .cc{display:none}.ac{display:none}
}
</style>
</head>

  const totH=p.totalDesc?`<div class="total"><div><div class="tll">Prima estimada</div><div class="tld">${p.totalDesc}</div></div><div><div class="trp">${pf}</div><div class="trs">al mes</div></div></div>`:''

function renderPortada(){

  for(const[fase,prods]of Object.entries(PORTADA)){
    h+=`<div class="pht">${fase}</div>`;
    prods.forEach(k=>{const p=PRODS[k];if(!p)return;h+=`<a class="pc" href="?producto=${k}"><span class="pico">${p.ico}</span><div><div class="pn">${p.nom}</div><div class="pd">${p.sub.substring(0,75)}...</div></div><span class="pa">›</span></a>`;});
  }
  h+=`<div class="pht">🤝 Para Agentes</div><a class="pc" href="?seccion=agente"><span class="pico">🤝</span><div><div class="pn">Oportunidad de negocio NN</div><div class="pd">Presentación personalizada para candidatos a agente.</div></div><span class="pa">›</span></a></div>${foot()}`;
  return h;
}

// MAIN
// ═══════════════════════════════════════════════════════════════════
function main(){
  const sec=q('seccion'),prod=q('producto').toLowerCase();
  const nombre=q('nombre')||q('name');
  const prima=q('prima')||q('price');
  const app=document.getElementById('app');
  if(sec==='agente')app.innerHTML=renderAgente(nombre);
  else if(prod&&PRODS[prod])app.innerHTML=renderProd(PRODS[prod],nombre,prima);
  else app.innerHTML=renderPortada();
}
window.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>{main();document.getElementById('app').style.display='block';const l=document.getElementById('loader');l.classList.add('off');setTimeout(()=>l.remove(),500);},700);
});
</script>
