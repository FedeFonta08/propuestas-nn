    <style>
        :root {
            --nn-orange: #EA650D;
            --nn-dark: #333333;
            --bg-color: #F9F9F9;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            text-align: center;
            padding-bottom: 30px;
        }

        .header {
            background-color: var(--nn-orange);
            height: 120px;
            position: relative;
        }

        /* Puedes cambiar esta URL por el nombre de las imágenes que has subido si las guardas en la misma carpeta (ej: logo.png) */
        .logo-container {
            width: 130px;
            height: 130px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            bottom: -65px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 15px;
        }

        .logo-container img {
            width: 100%;
            height: auto;
        }

        .profile-info {
            margin-top: 80px;
            padding: 0 20px;
        }

        .profile-info h1 {
            color: var(--nn-dark);
            font-size: 24px;
            margin-bottom: 5px;
        }

        .profile-info h2 {
            color: var(--nn-orange);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .profile-info p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .contact-list {
            list-style: none;
            padding: 0 30px;
            margin-bottom: 25px;
        }

        .contact-list li {
            margin-bottom: 15px;
        }

        .contact-list a {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--nn-dark);
            font-size: 15px;
            background: #f5f5f5;
            padding: 12px 20px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .contact-list a:hover {
            background: #ffebe0;
        }

        .contact-list svg {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            fill: var(--nn-orange);
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 30px;
            margin-bottom: 30px;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--nn-orange);
            color: white;
            box-shadow: 0 4px 10px rgba(234, 101, 13, 0.3);
        }

        .btn-primary svg {
            fill: white;
            margin-right: 10px;
        }

        .btn-secondary {
            background-color: white;
            color: var(--nn-orange);
            border: 2px solid var(--nn-orange);
        }

        .btn-secondary svg {
            fill: var(--nn-orange);
            margin-right: 10px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-icons a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            background-color: #f0f0f0;
            border-radius: 50%;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .social-icons a:hover {
            background-color: var(--nn-orange);
            transform: translateY(-3px);
        }

        .social-icons a:hover svg {
            fill: white;
        }

        .social-icons svg {
            width: 20px;
            height: 20px;
            fill: var(--nn-dark);
            transition: fill 0.3s ease;
        }
    </style>
</head>
