        function renderNode(node) {
            const div = document.createElement('div');
            div.className = `node level-${node.level}`;
            div.dataset.id = node.id;
            
            const content = document.createElement('div');
            content.className = 'node-content';
            
            if (node.children && node.children.length > 0) {
                const toggle = document.createElement('div');
                toggle.className = 'toggle';
                toggle.textContent = '▼';
                toggle.onclick = (e) => {
                    e.stopPropagation();
                    const children = div.querySelector('.children');
                    if (children.classList.contains('hidden')) {
                        children.classList.remove('hidden');
                        toggle.textContent = '▼';
                    } else {
                        children.classList.add('hidden');
                        toggle.textContent = '▶';
                    }
                };
                content.appendChild(toggle);
            }
            
            const text = document.createElement('div');
            text.className = 'node-text';
            text.textContent = node.text;
            content.appendChild(text);
            
            const badges = document.createElement('div');
            badges.className = 'node-badges';
            
            if (node.estado) {
                const badge = document.createElement('span');
                badge.className = 'badge';
                if (node.estado.includes('✅') || node.estado.includes('OPERATIVO') || node.estado.includes('COMPLETO')) {
                    badge.className += ' badge-estado';
                } else if (node.estado.includes('❌') || node.estado.includes('BLOQUEANTE') || node.estado.includes('FALTA')) {
                    badge.className += ' badge-urgencia';
                } else if (node.estado.includes('⚠️') || node.estado.includes('DESCONECTADO')) {
                    badge.className += ' badge-warning';
                } else {
                    badge.className += ' badge-info';
                }
                badge.textContent = node.estado;
                badges.appendChild(badge);
            }
            
            if (node.urgencia) {
                const badge = document.createElement('span');
                badge.className = 'badge badge-urgencia';
                badge.textContent = node.urgencia;
                badges.appendChild(badge);
            }
            
            if (node.prioridad) {
                const badge = document.createElement('span');
                badge.className = 'badge badge-urgencia';
                badge.textContent = node.prioridad;
                badges.appendChild(badge);
            }
            
            content.appendChild(badges);
            div.appendChild(content);
            
            // Añadir detalles si existen
            const details = [];
            if (node.descripcion) details.push(`<strong>Descripción:</strong> ${node.descripcion}`);
            if (node.archivo) details.push(`<strong>Archivo:</strong> ${node.archivo}`);
            if (node.progreso) details.push(`<strong>Progreso:</strong> ${node.progreso}`);
            if (node.objetivo) details.push(`<strong>Objetivo:</strong> ${node.objetivo}`);
            if (node.responsable) details.push(`<strong>Responsable:</strong> ${node.responsable}`);
            if (node.pendiente) details.push(`<strong>Pendiente:</strong> ${node.pendiente}`);
            if (node.problema) details.push(`<strong>Problema:</strong> ${node.problema}`);
            if (node.funciones) details.push(`<strong>Funciones:</strong> ${node.funciones}`);
            
            if (details.length > 0) {
                const detailsDiv = document.createElement('div');
                detailsDiv.className = 'details';
                detailsDiv.innerHTML = details.join('<br>');
                div.appendChild(detailsDiv);
            }
            
            if (node.children && node.children.length > 0) {
                const children = document.createElement('div');
                children.className = 'children';
                node.children.forEach(child => {
                    children.appendChild(renderNode(child));
                });
                div.appendChild(children);
            }
            
            return div;
        }
        
        function renderTree() {
            const tree = document.getElementById('tree');
            tree.innerHTML = '';
            tree.appendChild(renderNode(data.root));
        }
        
        function expandAll() {
            document.querySelectorAll('.children').forEach(el => {
                el.classList.remove('hidden');
            });
            document.querySelectorAll('.toggle').forEach(el => {
                el.textContent = '▼';
            });
        }
        
        function collapseAll() {
            document.querySelectorAll('.children').forEach(el => {
                el.classList.add('hidden');
            });
            document.querySelectorAll('.toggle').forEach(el => {
                el.textContent = '▶';
            });
        }
        
        function showOnlyUrgent() {
            resetView();
            document.querySelectorAll('.node').forEach(node => {
                const hasUrgent = node.textContent.includes('🔴') || 
                                  node.textContent.includes('URGENTE') || 
                                  node.textContent.includes('CRÍTICA');
                if (!hasUrgent) {
                    node.style.display = 'none';
                }
            });
        }
        
        function showOnlyBlocked() {
            resetView();
            document.querySelectorAll('.node').forEach(node => {
                const hasBlocked = node.textContent.includes('❌') || 
                                   node.textContent.includes('BLOQUEANTE') || 
                                   node.textContent.includes('FALTA');
                if (!hasBlocked) {
                    node.style.display = 'none';
                }
            });
        }
        
        function resetView() {
            document.querySelectorAll('.node').forEach(node => {
                node.style.display = '';
            });
            document.querySelectorAll('.node-content').forEach(el => {
                el.classList.remove('highlight');
            });
        }
        
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const search = e.target.value.toLowerCase();
            
            if (search === '') {
                resetView();
                return;
            }
            
            document.querySelectorAll('.node').forEach(node => {
                const text = node.textContent.toLowerCase();
                const nodeContent = node.querySelector('.node-content');
                
                if (text.includes(search)) {
                    nodeContent.classList.add('highlight');
                    
                    // Expandir padres
                    let parent = node.parentElement;
                    while (parent) {
                        if (parent.classList.contains('children')) {
                            parent.classList.remove('hidden');
                            const toggle = parent.previousElementSibling?.querySelector('.toggle');
                            if (toggle) toggle.textContent = '▼';
                        }
                        parent = parent.parentElement;
                    }
                } else {
                    nodeContent.classList.remove('highlight');
                }
            });
        });
        
        renderTree();
    </script>
